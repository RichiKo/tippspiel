<div class="championship-card" (click)="onCardClick()">
  <img
    class="championship-image"
    [src]="championship()?.image"
    [alt]="championship()?.name"
  />
  <div class="championship-content">
    <h2>{{ championship()?.name }}</h2>
    @if (championship()?.description) {
      <p>{{ championship()?.description }}</p>
    }
    <div class="championship-meta">
      <span
        >Status:
        <strong>{{
          championship()?.isActive ? "Aktiv" : "Inaktiv"
        }}</strong></span
      >
      @if (championship()?.isPublic) {
        <span>Öffentlich</span>
      }
      @if (!championship()?.isPublic) {
        <span>Privat</span>
      }
    </div>
    @if (isAdmin()) {
      <div class="championship-actions" (click)="$event.stopPropagation()">
        <a
          [routerLink]="['/dashboard/championship', championship()?.id, 'edit']"
          class="edit-link"
        >
          Bearbeiten
        </a>
        <button type="button" class="delete-btn" (click)="onDeleteClick()">
          Löschen
        </button>
      </div>
    }
  </div>
  <app-confirmation-dialog
    [visible]="showDeleteDialog()"
    [title]="'Löschen bestätigen'"
    [message]="
      'Möchtest du die Championship »' +
      (championship()?.name ?? '') +
      '« wirklich löschen?'
    "
    [confirmLabel]="'Löschen'"
    [cancelLabel]="'Abbrechen'"
    (confirmed)="handleDeleteConfirm()"
    (cancelled)="handleDeleteCancel()"
  />
</div>
