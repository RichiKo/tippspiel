<div class="spieltags-table-view">
  <p class="table-meta">{{ evaluatedGamesCount() }} gewertete Spiele</p>

  @if (rows().length > 0) {
    <div class="table-wrapper">
      <table class="spieltags-table">
        <thead>
          <tr>
            <th class="rank-col">Platz</th>
            <th>Teilnehmer</th>
            <th class="num-col">Punkte (Spiele)</th>
          </tr>
        </thead>
        <tbody>
          @for (row of rows(); track row.userId; let i = $index) {
            <tr [class.current-user]="isCurrentUser(row.userId)" [class.top-three]="i < 3">
              <td class="rank-col">
                <span
                  class="rank-pill"
                  [class.rank-pill--gold]="i === 0"
                  [class.rank-pill--silver]="i === 1"
                  [class.rank-pill--bronze]="i === 2"
                >
                  {{ row.place }}
                </span>
              </td>
              <td class="name-col" [title]="row.username">{{ row.username }}</td>
              <td class="num-col">{{ row.gamePoints }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  } @else {
    <p class="table-empty">Noch keine gewerteten Spiele.</p>
  }
</div>
