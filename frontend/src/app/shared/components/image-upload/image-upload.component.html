<div class="image-upload-container">
  <div class="upload-label">{{ label() | translate }}</div>

  @if (hasImage()) {
    <div class="image-preview-box">
      <img [src]="displayImageUrl()" alt="Preview" class="preview-image" />
      
      @if (isUploading()) {
        <div class="loading-overlay">
          <mat-spinner diameter="40"></mat-spinner>
        </div>
      }
      
      @if (!isUploading()) {
        <button
          mat-icon-button
          class="remove-btn"
          type="button"
          (click)="removeImage()"
        >
          <mat-icon>close</mat-icon>
        </button>
      }
    </div>
  } @else {
    <div class="upload-box">
      <input
        type="file"
        [attr.accept]="acceptedMimeTypes()"
        (change)="onFileSelected($event)"
        #fileInput
        class="file-input"
      />
      
      @if (isUploading()) {
        <div class="loading-state">
          <mat-spinner diameter="40"></mat-spinner>
          <p>{{ 'imageUpload.uploading' | translate }}</p>
        </div>
      } @else {
        <button
          mat-raised-button
          color="primary"
          type="button"
          (click)="fileInput.click()"
        >
          <mat-icon>cloud_upload</mat-icon>
          {{ 'imageUpload.selectButton' | translate }}
        </button>
        <p class="upload-hint">
          {{ uploadHintKey() | translate : { size: maxSizeMB() } }}
        </p>
      }
    </div>
  }

  @if (errorMessage()) {
    <div class="error-message">
      <mat-icon>error</mat-icon>
      {{ errorMessage() }}
    </div>
  }
</div>
