@if (visible()) {
  <div class="cd-backdrop" (click)="onCancel()">
    <section class="cd-dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
      <h3 class="cd-title">{{ title() }}</h3>
      <p class="cd-message">{{ message() }}</p>
      <div class="cd-actions">
        @if (showCancelButton()) {
          <ui-button type="button" variant="secondary" size="sm" (click)="onCancel()">
            {{ cancelLabel() }}
          </ui-button>
        }
        <ui-button type="button" variant="danger" size="sm" (click)="onConfirm()">
          {{ confirmLabel() }}
        </ui-button>
      </div>
    </section>
  </div>
}
