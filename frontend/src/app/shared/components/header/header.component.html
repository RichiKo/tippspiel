<header class="app-header">
  @if (currentUser(); as user) {
    <div class="header-content">
      <div class="header-left">
        <button class="logo-btn" (click)="navigateToDashboard()">
          <lucide-icon class="logo-icon" [img]="icons.trophy" [size]="20" aria-hidden="true" />
          <span class="logo-text">Tipp-Spiel</span>
        </button>
      </div>

      <div class="header-right">
        <div class="user-info">
          <div class="user-avatar">
            @if (user.image) {
              <img [src]="user.image" [alt]="user.username" />
            } @else {
              <span class="avatar-placeholder">{{ user.username.charAt(0).toUpperCase() }}</span>
            }
          </div>
          <span class="username">{{ user.username }}</span>
        </div>

        <button
          class="settings-btn desktop-only"
          (click)="navigateToSettings()"
          title="Einstellungen"
          aria-label="Einstellungen"
        >
          <lucide-icon [img]="icons.settings" [size]="18" aria-hidden="true" />
        </button>

        <button class="logout-btn desktop-only" (click)="onLogoutClick()">
          <lucide-icon [img]="icons.logOut" [size]="16" aria-hidden="true" />
          Abmelden
        </button>

        <button
          type="button"
          class="mobile-menu-toggle mobile-only"
          (click)="onMobileMenuToggle()"
          [attr.aria-expanded]="isMobileMenuOpen()"
          [attr.aria-label]="isMobileMenuOpen() ? 'Menü schließen' : 'Menü öffnen'"
        >
          <lucide-icon [img]="icons.ellipsisVertical" [size]="18" aria-hidden="true" />
        </button>
      </div>
    </div>

    @if (isMobileMenuOpen()) {
      <button
        type="button"
        class="mobile-menu-backdrop mobile-only"
        aria-label="Menü schließen"
        (click)="onMobileMenuClose()"
      ></button>

      <div class="mobile-menu mobile-only">
        <button type="button" class="mobile-menu-item" (click)="navigateToSettings()">
          <lucide-icon [img]="icons.settings" [size]="16" aria-hidden="true" />
          Einstellungen
        </button>
        <button type="button" class="mobile-menu-item danger" (click)="onLogoutClick()">
          <lucide-icon [img]="icons.logOut" [size]="16" aria-hidden="true" />
          Abmelden
        </button>
      </div>
    }
  }

</header>

<app-confirmation-dialog
  [visible]="showLogoutConfirm()"
  [title]="'Abmelden'"
  [message]="'Möchtest du dich wirklich abmelden?'"
  [confirmLabel]="'Abmelden'"
  [cancelLabel]="'Abbrechen'"
  (confirmed)="onLogoutConfirmed()"
  (cancelled)="onLogoutCancelled()"
/>
