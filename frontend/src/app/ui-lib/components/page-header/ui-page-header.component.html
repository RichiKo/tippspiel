<header class="ui-page-header">
  <div class="ui-page-header__main">
    @if (showBack()) {
      <ui-button
        variant="secondary"
        size="md"
        class="ui-page-header__back"
        (click)="onBack()"
      >
        <lucide-icon
          [img]="icons.arrowLeft"
          [size]="16"
          aria-hidden="true"
        ></lucide-icon>
        <span>{{ backLabel() | translate }}</span>
      </ui-button>
    }

    <div class="ui-page-header__copy">
      @if (kicker()) {
        <p class="ui-page-header__kicker">{{ kicker() }}</p>
      }
      <h1 class="ui-page-header__title">{{ title() }}</h1>
      @if (subtitle()) {
        <p class="ui-page-header__subtitle">{{ subtitle() }}</p>
      }
    </div>
  </div>

  <div class="ui-page-header__actions">
    <ng-content select="[uiPageHeaderActions]" />
  </div>
</header>
